[package]
name = "uturn"
version = "0.3.4"
edition = "2021"
authors = ["Per Enstedt <per.enstedt@eyevinn.se>"]
description = "Single-port TURN relay for WebRTC — internal and external routing over one UDP port"
license = "MIT OR Apache-2.0"
repository = "https://github.com/srperens/uturn"
keywords = ["webrtc", "turn", "stun", "relay", "nat-traversal"]
categories = ["network-programming", "multimedia"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Networking
bytes = "1"
socket2 = "0.6"

# Data structures
dashmap = "6"
parking_lot = "0.12"

# Crypto (for TURN auth)
hmac = "0.13"
sha1 = "0.11"
md5 = "0.8"
base64 = "0.22"
crc = "3"
rand = "0.10"

# Config & CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"


[profile.release]
lto = true
codegen-units = 1
panic = "abort"
